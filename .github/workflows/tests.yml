name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: SkillsHubCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test
        working-directory: Packages/SkillsHubCore
        run: swift test

  app-macos:
    name: SkillsHub (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Test SkillsHubCore
        working-directory: Packages/SkillsHubCore
        run: swift test
      - name: Build and test the app
        run: |
          xcodebuild -project SkillsHub.xcodeproj -scheme SkillsHub \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
